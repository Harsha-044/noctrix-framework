services:
  neo4j:
    image: neo4j:5-community
    container_name: noctrix-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  vault:
    image: hashicorp/vault:1.15
    container_name: noctrix-vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    restart: unless-stopped

  dashboard:
    build: .
    container_name: noctrix-dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - neo4j
    restart: unless-stopped

volumes:
  neo4j_data:
