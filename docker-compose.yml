version: '3.8'
services:
  neo4j:
    image: neo4j:5.20-enterprise
    container_name: noctrix-neo4j
    environment:
      - NEO4J_AUTH=neo4j/NoctrixSecurePass123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data: